<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Товар</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>
<h1>Товар</h1>
<form th:action="@{/products}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <p>
        <label>Название: <input type="text" th:field="*{name}"/></label>
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </p>
    <p>
        <label>Описание: <input type="text" th:field="*{description}"/></label>
    </p>
    <p>
        <label>Цена: <input type="number" step="0.01" th:field="*{price}"/></label>
        <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
    </p>
    <p>
        <label>Количество: <input type="number" th:field="*{quantity}"/></label>
        <span class="error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
    </p>
    <button type="submit">Сохранить</button>
    <a href="/">Отмена</a>
</form>
</body>
</html>
