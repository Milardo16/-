<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Онлайн магазин</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .btn { padding: 5px 10px; text-decoration: none; background: #007bff; color: white; border-radius: 4px; }
        .btn-danger { background: #dc3545; }
    </style>
</head>
<body>
<h1>🛒 Каталог товаров</h1>

<div>
        <span sec:authorize="isAuthenticated()">
            Привет, <b sec:authentication="name"></b>!
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Выйти</button>
            </form>
        </span>
    <span sec:authorize="!isAuthenticated()">
            <a href="/login">Войти</a>
        </span>
</div>

<br/>
<a sec:authorize="hasRole('ADMIN')" class="btn" href="/products/new">+ Добавить товар</a>

<table>
    <thead>
    <tr>
        <th>ID</th><th>Название</th><th>Описание</th><th>Цена</th><th>Кол-во</th>
        <th sec:authorize="hasRole('ADMIN')">Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.description}"></td>
        <td th:text="${p.price} + ' ₽'"></td>
        <td th:text="${p.quantity}"></td>
        <td sec:authorize="hasRole('ADMIN')">
            <a class="btn" th:href="@{'/products/edit/' + ${p.id}}">Изменить</a>
            <a class="btn btn-danger" th:href="@{'/products/delete/' + ${p.id}}">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
